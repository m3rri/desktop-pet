<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <link rel="stylesheet" href="../assets/fonts/gaegu/gaegu.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    canvas { position: absolute; left: 0; top: 0; }
    /* 폰트: 앱에 같이 넣은 Gaegu. 못 불러오면 맑은 고딕 → OS 기본 글꼴 */
    #text {
      position: absolute;
      font-family: 'Gaegu', 'Malgun Gothic', 'Segoe UI Emoji', sans-serif; /* 이모지는 Gaegu·맑은 고딕에 없어 Windows 이모지 글꼴로 */
      font-size: 21px;
      line-height: 1.15;
      color: #3e2c26;
      /* 창이 아직 작을 때 재도 글자 폭만큼 넓게 (max-width를 넘으면 줄바꿈) */
      width: max-content;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: anywhere;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="bubble"></canvas>
  <div id="text"></div>
  <script src="bubble.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    img { display: block; width: 100%; height: 100%; cursor: grab; -webkit-user-drag: none; }
    img[hidden] { display: none; }
    img:active { cursor: grabbing; }
  </style>
</head>
<body>
  <img id="full" alt="" hidden><img id="half" alt="" hidden><img id="empty" alt="" hidden>
  <script src="bowl.js"></script>
</body>
</html>
